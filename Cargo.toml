# GoPtop workspace — P2P 围棋 / 五子棋
# 约定：resolver = "2"，edition = "2024"（项目规范强制），成员含 Rust crates 与 Tauri 后端。
# frontend/ 为独立 npm 包，不纳入 Cargo workspace。

[workspace]
members = ["crates/goptop-core", "crates/goptop-net", "crates/goptop-transport", "crates/goptop-server", "crates/goptop-ai", "src-tauri"]
# vendored 的 figrid-board 经 [patch.crates-io] 引入，是独立 package：
# 纳入成员会让它自己的 lock/target 与本仓库互相干扰
exclude = ["crates/goptop-ai/vendor/figrid-board"]
resolver = "2"

# 发布体积优化（用户拍板 2026-09-13：release 二进制报真实尺寸）：
# fat LTO + 单 codegen unit + abort panic + strip 符号；opt-level "s" 折中体积与速度。
# 该 profile 同时作用于 wasm32 构建（scripts/build-wasm.sh 的 --release 同享）。
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# 共享依赖版本，便于各 crate 对齐。core/transport/tauri 三处复用 serde 等基础库。
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

# Tauri 相关由 src-tauri/Cargo.toml 自行声明版本，workspace 仅收敛通用库。

# 五子棋引擎改用仓内 vendor 副本：上游全程用 std::time::Instant，而
# wasm32-unknown-unknown 上 std 没有时钟，搜索一调用就 panic（编译期不报错）。
# 改动仅为把 4 处 `use std::time::` 换成 `use web_time::`，详见
# crates/goptop-ai/vendor/README.md。上游若自行支持 web-time 应撤回本 patch。
[patch.crates-io]
figrid-board = { path = "crates/goptop-ai/vendor/figrid-board" }
