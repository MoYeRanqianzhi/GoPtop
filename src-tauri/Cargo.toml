[package]
# src-tauri — Tauri 2 后端，当前只承载窗口（早期规划的 iroh Endpoint 路线已弃；
# 核心规则经 goptop-core 的 wasm 在 WebView 内执行，与 Web 同一份）。
# 将来移动端亦复用此后端壳。
name = "goptop"
version = "0.1.0-alpha.0"
description = "GoPtop — P2P Gomoku & Go (Tauri backend)"
authors = ["GoPtop Contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
# Windows 上与 bin 重名会导致链接冲突，Tauri 模板以 _lib 后缀规避，见 https://github.com/rust-lang/cargo/issues/8519
name = "goptop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# store.rs 的存储文件是单文件 JSON（键值表），复用 workspace 统一版本。
serde_json = { workspace = true }

# —— 核心逻辑以原生代码链接进来 ——
# 桌面与 Android 都有完整的 Rust native 宿主（goptop.exe / libgoptop_lib.so），
# 没有理由绕道 wasm 在 WebView 里跑：wasm 只是 **Web 端的编译目标**，
# 因为浏览器跑不了原生代码。把它当成全平台的实现方式是架构错误。
# 这两个 crate 本身就是平台无关的纯逻辑（wasm-bindgen/js-sys 都是 optional，
# 只在 `wasm` feature 下启用），直接 use 即可，零桥接成本。
goptop-core = { path = "../crates/goptop-core" }
goptop-ai = { path = "../crates/goptop-ai" }
# HostAction 的 serde 派生（回给前端的宿主动作队列）
serde = { workspace = true }
# 传输层的调度运行时（见 src/session.rs 的 runtime()：不能依赖 Tauri 的）
tokio = { workspace = true }
# P2P 会话的原生执行器（WebSocket / WebRTC / 同源通道）。
# 传输层的**逻辑**在 goptop-net，本 crate 是它在本平台的 IO 后端。
goptop-transport-native = { path = "../crates/goptop-transport-native" }
# UI 命令的 serde 契约（`UiCommand`）：session.rs 的命令面只有 `session_cmd` 一个口子，
# 线上形态就是本枚举的序列化结果——直接依赖它，而不是在宿主里再抄一份分派表。
goptop-net = { path = "../crates/goptop-net" }
# 「Agent 对战」的核心（pair 会话对 / agent_loop 决策循环 / vfs+registry 工具面 /
# 三协议 LLM 客户端）。本 crate 只做接壳装配（src-tauri/src/agent.rs），
# 决策与工具语义全部在那个 crate——一行不重做。
goptop-agent = { path = "../crates/goptop-agent" }
# HttpChannel 的日志包装（agent.rs 的 LogHttp）要与 trait 同一套 async-trait
# 脱糖宏，否则 lifetime 形状对不上（E0195）——版本与 goptop-agent 对齐（0.1）。
async-trait = "0.1"

# Windows Snap Layouts 覆盖层（src-tauri/src/titlebar.rs）：透明子窗口 + HTMAXBUTTON。
# 只需 Win32 最小面：Foundation/LibraryLoader/WindowsAndMessaging。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# 「Agent 对战」的 MCP 出口（阶段④，计划 MCP 节「条件编译（用户拍板）」）：
# 同一 path 依赖的第二段声明——cargo 对同一依赖在多段里的 feature 取**并集**
# （匹配的目标两段同时生效，`mcp` 拉起 rmcp/axum；不匹配的目标只吃上面的
# [dependencies] 段，MCP 代码整体不编译，非「编译了但禁用」）。
# **为什么谓词不是 `cfg(desktop)`**：`desktop` 是 tauri-build 的 build-script
# rustc-cfg，只对**代码**的 #[cfg] 生效；cargo 的目标段解析发生在构建脚本之前，
# 只认标准目标 cfg——实测 `cfg(desktop)` 段静默不匹配、feature 不并（本仓
# commit 前实测）。桌面/移动的标准分界是 OS：排除 android/ios 即桌面三端，
# 效果与 tauri 的 desktop 门一致（wasm 从不构建本 crate，harmony 走 goptop-ohos）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
goptop-agent = { path = "../crates/goptop-agent", features = ["mcp"] }
