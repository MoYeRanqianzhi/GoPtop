[package]
# 与 workspace 其他 crate 同名风格（连字符）。lib 名由 cargo 自动转下划线，
# 代码里 use 的是 goptop_transport_native。
name = "goptop-transport-native"
version = "0.1.0-alpha.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
futures-util = "0.3.34"
goptop-net = { version = "0.1.0-alpha.0", path = "../goptop-net" }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = "0.30.0"
webrtc = "0.20.5"
