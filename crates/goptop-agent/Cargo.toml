[package]
# goptop-agent —— 「Agent 对战」的平台无关核心（权威规格 .agents/plan/2026-10-08-agent-battle.md）。
# Agent 玩家 = 无头会话 + 决策层：会话对(pair) / 玩家席与事件物化(player) /
# 一切皆文件(vfs) / 工具面(tools+registry) / LLM 决策循环(agent_loop) / 上下文压缩(compact)。
# 不含 tauri / rmcp 主干：桌面壳在 src-tauri/src/agent.rs 接壳（阶段③），
# MCP 出口走本 crate 的 `mcp` feature（阶段④，仅桌面目标编译）。
name = "goptop-agent"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.85"
description = "GoPtop agent — an LLM player over headless P2P sessions"
license = "MIT OR Apache-2.0"

[lib]
name = "goptop_agent"
crate-type = ["rlib"]

[dependencies]
# 会话状态机的唯一命令口（UiCommand）与唯一读口（snapshot）——协议零改动复用。
goptop-net = { version = "0.1.0-alpha.0", path = "../goptop-net" }
# /game/history/<n> 的局面重放要过真规则引擎（围棋提子手搓必错）：核心层是
# goptop-net 的既有 workspace 依赖，这里直接按路径挂，不添外部包。
goptop-core = { version = "0.1.0-alpha.0", path = "../goptop-core" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# HttpChannel / Compactor 的 async trait 方法要 dyn 兼容（enum 变体里存 Arc<dyn>），
# 用仓库既有同款方案（goptop-transport-native 亦用 async-trait）。
async-trait = "0.1"
# /game/board/image.png 的栅格编码。计划原文写 `image` crate，但其依赖树远超需求；
# png 0.17 已在 lock 里（tauri-codegen 链路的传递依赖），按「不添依赖是纪律」的
# 同款取舍（registry 的 mini_regex 先例）直接挂已锁定的 png，零新增 lock 条目。
png = "0.17"
# 图像回执的 base64（承载能力矩阵：Anthropic tool_result 原生 image block）。
# base64 0.22 已在 lock 里（reqwest/rustls 链路的传递依赖），同款取舍零新增条目。
base64 = "0.22"
# ---- MCP 出口（feature "mcp"，阶段④）----
# 条件编译（计划「MCP 模式」节·用户拍板）：`mcp` feature 只在桌面目标启用——
# src-tauri 按 [target.'cfg(desktop)'.dependencies] 挂 feature；安卓/鸿蒙与 wasm
# 完全不编译本 feature 的代码（不是「编译了但禁用」）。以下两项 optional，
# 只有 mcp feature 拉进来。
# rmcp 3.2.0 的 feature 实际拼写（实施首日 cargo add + 范本双重验证）：server +
# transport-streamable-http-server，与 .ref/codex tui 的挂法逐字一致；default-features
# 由 workspace 统一全关（auth/schemars/client 不进树）。
rmcp = { workspace = true, optional = true, features = ["server", "transport-streamable-http-server"] }
# StreamableHttpService 是 tower Service：Router/serve/Bearer 中间件由本仓 axum 供，
# 与 goptop-server 同一条 0.8（default-features 关掉，按需 http1/json/tokio）。
axum = { workspace = true, optional = true }

# ---- 阶段⑤（Web 内置模式）目标表切割（契约 §3.1）----
# 桌面/移动（非 wasm32）：无头会话执行器（NativeSession/Host）、tokio 全量、
# reqwest HTTP 通道、rusqlite 记忆库。web 目标下这些一律不编译——NativeSession
# 的 webrtc 链会把 getrandom 拖进 wasm（其 compile_error 是 wasm 构建的第一报错）。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# 无头会话执行器（NativeSession / Host）。web 端（阶段⑤）B 席由 goptop-transport
# 的 agent 出口建（WebPlayer），这份依赖按 cfg 收窄到非 wasm 目标。
goptop-transport-native = { version = "0.1.0-alpha.0", path = "../goptop-transport-native" }
tokio = { workspace = true, features = ["full"] }
# LLM HTTP 通道的 native 实现（阶段②三协议适配器）。骨架期只声明依赖，
# 代码面全部藏在 HttpChannel trait 之后（见 llm/mod.rs）。
reqwest = { workspace = true }
# reqwest 0.13 的 `rustls-no-provider` 不带 crypto provider，必须由使用方显式装一个。
# 选 ring：aws-lc-rs（reqwest `rustls` feature 的默认 provider）在 Windows MSVC 上
# 要现场编 C 源、NASM/CMake 工具链要求高；ring 0.17 已在本仓 lock 里（webrtc 链路），
# 工具链要求零增。provider 安装是进程级一次性动作，落在 native HttpChannel 里。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# /memory 的 native 后端（rusqlite bundled ~/.goptop/agent-memory.db）。
# bundled：不依赖系统 libsqlite3，三平台一把编。
rusqlite = { workspace = true }

# wasm32（Web 端内置模式，阶段⑤）：循环驱动不经 tokio time/net（wasm 上 panic /
# 编译失败，契约 §1），await 点全部走 [`crate::time_compat::delay`] 的
# setTimeout Promise；watch 保留（tokio 白名单里 sync 纯 std，可被 spawn_local 驱动）。
# tokio 不能 workspace=true——workspace 定义带 `features=["full"]`，在 wasm 直接
# compile_error（tokio 的 feature 白名单），必须本地写窄。
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2"
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"

# web 通道（llm/web_http.rs）的 fetch 面。Headers/RequestInit/Response 只为
# HttpChannel；Window 给钩子取数。特性随本 crate 进树后与 goptop-transport 的
# web-sys 特性面做 feature 统一，互不冲突。
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["Window", "Headers", "RequestInit", "Response", "Storage", "Crypto", "console"]

[features]
# dep: 前缀（而非裸名）：optional 依赖只在被本 feature 拉起时启用，不再隐式
# 生成同名 feature 面（edition 2024 / cargo 现代惯用形）。
mcp = ["dep:rmcp", "dep:axum"]

[dev-dependencies]
# MCP 测试（tests/mcp_server.rs，--features mcp 下跑）的裸 JSON-RPC over HTTP
# 客户端：不引 rmcp client——JSON-RPC 消息与 streamable HTTP 头（Accept 双形态/
# mcp-session-id 回传/Bearer）全按规范手搓，reqwest 只是 HTTP 搬运工。
reqwest = { workspace = true }
# rustls 0.23 的进程级 crypto provider 要显式安装（与 native_http.rs 同款幂等
# 安装），reqwest Client 构造期就要 provider；ring 与主依赖同一份零新增。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
