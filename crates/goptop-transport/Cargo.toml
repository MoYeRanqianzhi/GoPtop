[package]
# goptop-transport — Rust 侧传输抽象（当前无调用者，未接线；见 src/lib.rs 头注释）。
# 现行 P2P 传输在前端 TS（WebRTC STUN-only）；本 crate 保留 trait + memory 实现备用。
name = "goptop-transport"
version = "0.1.0-alpha.0"
edition = "2024"
description = "GoPtop transport abstraction (unwired; live transport lives in frontend TS)"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[dependencies]
goptop-core = { path = "../goptop-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[features]
# 空占位：引入任何具体实现前保持 default = []。禁中转是设计红线，不得添加 relay/TURN 依赖。
default = []
